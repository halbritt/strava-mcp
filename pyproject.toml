[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "strava-mcp"
version = "0.1.0"
description = "Read-only Strava MCP connector for activities, metrics, and athlete data"
requires-python = ">=3.12"
dependencies = [
  "mcp>=2.3",
  "httpx>=0.27",
  "pydantic>=2",
  "uvicorn>=0.30",
]

[project.scripts]
strava-mcp = "strava_mcp.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "pyright>=1.1.380",
]

[tool.hatch.build.targets.wheel]
packages = ["src/strava_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "TID"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "SIM"]

[tool.pyright]
include = ["src", "tests/unit"]
exclude = ["**/__pycache__", ".venv", "tests/e2e"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingImports = "error"
reportMissingTypeStubs = "none"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportGeneralTypeIssues = "warning"
